<!-- =========================================================================
     DRAWER LATERAL DE NOTIFICACIONES
     ========================================================================= -->

<aside class="notification-drawer" id="notificationDrawer">
  <div class="drawer-header">
    <h4 style="display: flex; align-items: center; gap: 0.5rem;">
      <i class="fas fa-bell" style="color: var(--primary);"></i> Notificaciones
    </h4>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <button class="btn btn-secondary btn-sm" id="markAllNotificationsReadBtn" title="Marcar todas como leídas">
        <i class="fas fa-check-double"></i>
      </button>
      <button class="btn-icon" id="closeNotificationDrawerBtn">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
  <div class="drawer-content" id="notificationsList">
    <!-- Elementos dinámicos -->
  </div>
</aside>
