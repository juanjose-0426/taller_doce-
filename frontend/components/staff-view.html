<section id="staffView" class="view-section">
  <div class="staff-container">
    
    <div class="staff-toolbar">
      <div class="staff-metrics">
        <div class="staff-metric-item">
          <span class="text-muted-sm">Total Equipos:</span>
          <span class="staff-metric-count" id="staffMetricTotal">--</span>
        </div>
        <div class="staff-metric-item">
          <span class="staff-metric-label icon-success">Disponibles:</span>
          <span class="staff-metric-count icon-success" id="staffMetricDisp">--</span>
        </div>
        <div class="staff-metric-item">
          <span class="staff-metric-label icon-danger">Ocupados:</span>
          <span class="staff-metric-count icon-danger" id="staffMetricOcup">--</span>
        </div>
        <div class="staff-metric-item">
          <span class="staff-metric-label icon-warning">En Espera:</span>
          <span class="staff-metric-count icon-warning" id="staffMetricCola">--</span>
        </div>
      </div>

      <div class="flex-row-sm">
        <button type="button" class="btn btn-secondary btn-sm" onclick="window.showModal('staffAddQueueModal')">
          <i class="fas fa-user-plus"></i> Agregar Visitante a Fila
        </button>
        <button type="button" class="btn btn-primary btn-sm" onclick="staffPanel.loadPCs()">
          <i class="fas fa-sync-alt"></i> Actualizar
        </button>
      </div>
    </div>

    <div id="staffHelpRequestsContainer" class="is-hidden"></div>

    <div>
      <div class="pc-grid-header">
        <h3><i class="fas fa-desktop icon-primary"></i> Supervisión de Equipos en Sala</h3>
        <span class="text-muted-sm">Actualización en vivo cada segundo</span>
      </div>
      <div class="pc-grid" id="staffPcGrid"></div>
    </div>

    <div class="queue-table-container">
      <div class="queue-table-header">
        <h4><i class="fas fa-users icon-warning"></i> Fila de Espera Digital Activa</h4>
        <span class="status-badge warning" id="staffQueueBadge">0 en espera</span>
      </div>
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Turno</th>
              <th>Usuario</th>
              <th>Documento</th>
              <th>Hora y Tiempo de Espera</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="staffQueueTableBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</section>
