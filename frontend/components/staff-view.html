<!-- -----------------------------------------------------------------------
     VISTA 3: VISTA Y PANEL DE FUNCIONARIOS DE SALA (#staffView)
     ----------------------------------------------------------------------- -->

<section id="staffView" class="view-section">
  <div class="staff-container">
    
    <!-- Barra de métricas y controles rápidos -->
    <div class="staff-toolbar">
      <div class="staff-metrics">
        <div class="staff-metric-item">
          <span style="color: var(--text-muted); font-size: 0.85rem;">Total Equipos:</span>
          <span class="staff-metric-count" id="staffMetricTotal">--</span>
        </div>
        <div class="staff-metric-item">
          <span style="color: var(--status-disponible); font-size: 0.85rem;">Disponibles:</span>
          <span class="staff-metric-count" style="color: var(--status-disponible);" id="staffMetricDisp">--</span>
        </div>
        <div class="staff-metric-item">
          <span style="color: var(--status-ocupado); font-size: 0.85rem;">Ocupados:</span>
          <span class="staff-metric-count" style="color: var(--status-ocupado);" id="staffMetricOcup">--</span>
        </div>
        <div class="staff-metric-item">
          <span style="color: var(--status-warning); font-size: 0.85rem;">En Espera:</span>
          <span class="staff-metric-count" style="color: var(--status-warning);" id="staffMetricCola">--</span>
        </div>
      </div>

      <div style="display: flex; gap: 0.5rem;">
        <button class="btn btn-secondary btn-sm" onclick="window.showModal('staffAddQueueModal')">
          <i class="fas fa-user-plus"></i> Agregar Visitante a Fila
        </button>
        <button class="btn btn-primary btn-sm" onclick="staffPanel.loadPCs()">
          <i class="fas fa-sync-alt"></i> Actualizar
        </button>
      </div>
    </div>

    <!-- Matriz de Computadores con Temporizadores Regresivos -->
    <div>
      <div class="pc-grid-header">
        <h3><i class="fas fa-desktop" style="color: var(--primary);"></i> Supervisión de Equipos en Sala</h3>
        <span style="font-size: 0.82rem; color: var(--text-muted);">Actualización en vivo cada segundo</span>
      </div>
      <div class="pc-grid" id="staffPcGrid">
        <!-- Renderizado dinámico -->
      </div>
    </div>

    <!-- Gestión de Fila de Espera Digital -->
    <div class="queue-table-container">
      <div class="queue-table-header">
        <h4><i class="fas fa-users" style="color: var(--status-warning);"></i> Fila de Espera Digital Activa</h4>
        <span class="status-badge warning" id="staffQueueBadge">0 en espera</span>
      </div>
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Turno</th>
              <th>Usuario</th>
              <th>Documento</th>
              <th>Hora y Tiempo de Espera</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="staffQueueTableBody">
            <!-- Renderizado dinámico -->
          </tbody>
        </table>
      </div>
    </div>

  </div>
</section>
