<div class="modal-overlay" id="adminPcModal">
  <div class="modal-card admin-portal">
    <div class="modal-header">
      <h3 id="adminPcModalTitle">Registrar Computador</h3>
      <button class="btn-icon" onclick="window.hideModal('adminPcModal')"><i class="fas fa-times"></i></button>
    </div>
    <form id="adminPcForm">
      <input type="hidden" id="adminPcId">
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label>Nombre del Equipo:</label>
            <input type="text" id="adminPcNombre" placeholder="Ej: PC-13" required>
          </div>
          <div class="form-group">
            <label>Número Identificador:</label>
            <input type="text" id="adminPcNumero" placeholder="Ej: 13" required>
          </div>
        </div>
        <div class="form-group">
          <label>Ubicación en Biblioteca:</label>
          <input type="text" id="adminPcUbicacion" placeholder="Ej: Sala General / Pasillo A" required>
        </div>
        <div class="form-group">
          <label>Especificaciones / Observaciones:</label>
          <input type="text" id="adminPcSpecs" placeholder="Ej: Core i5, 16GB RAM, Windows 11">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="window.hideModal('adminPcModal')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar Computador</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="adminUserModal">
  <div class="modal-card admin-portal">
    <div class="modal-header">
      <h3 id="adminUserModalTitle">Gestión de Usuario</h3>
      <button class="btn-icon" onclick="window.hideModal('adminUserModal')"><i class="fas fa-times"></i></button>
    </div>
    <form id="adminUserForm">
      <input type="hidden" id="adminUserId">
      <div class="modal-body">
        <div class="form-group">
          <label>Nombre Completo:</label>
          <input type="text" id="adminUserNombre" placeholder="Nombre completo" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Documento:</label>
            <input type="text" id="adminUserDoc" placeholder="C.C. o T.I." required>
          </div>
          <div class="form-group">
            <label>Correo Electrónico:</label>
            <input type="email" id="adminUserCorreo" placeholder="correo@ejemplo.com" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Rol del Sistema:</label>
            <select id="adminUserRol">
              <option value="3">Usuario (Comunidad)</option>
              <option value="2">Funcionario (Personal Sala)</option>
              <option value="1">Super Administrador</option>
            </select>
          </div>
          <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" id="adminUserPass" placeholder="Nueva contraseña">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="window.hideModal('adminUserModal')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar Usuario</button>
      </div>
    </form>
  </div>
</div>
