<header class="main-header">
  <div class="header-container">
    
    <a href="javascript:void(0)" class="brand" onclick="window.router.navigate('publicView')">
      <div class="brand-icon">
        <i class="fas fa-desktop"></i>
      </div>
      <div class="brand-info">
        <span class="brand-title">BiblioTiempoDoce</span>
        <span class="brand-subtitle">Biblioteca 12 de Octubre</span>
      </div>
    </a>

    <div class="header-center">
      <div class="system-clock">
        <i class="fas fa-clock"></i>
        <span id="systemClockTime">00:00:00</span>
      </div>
      <div id="navLinks" class="nav-links-group"></div>
    </div>

    <div class="header-actions">
      <button type="button" class="btn-icon" id="fontScaleToggleBtn" title="Aumentar / Restaurar tamaño de letra (Accesibilidad)" aria-label="Aumentar o restaurar tamaño de letra">
        <span class="font-scale-label">A+</span>
      </button>

      <button type="button" class="btn-icon" id="themeToggleBtn" title="Cambiar entre Tema Claro y Oscuro" aria-label="Cambiar entre Tema Claro y Oscuro">
        <i class="fas fa-moon" id="themeToggleIcon"></i>
      </button>

      <button type="button" class="btn-icon" id="notificationToggleBtn" title="Notificaciones" aria-label="Notificaciones">
        <i class="fas fa-bell"></i>
        <span id="navNotificationBadge" class="nav-notif-badge">0</span>
      </button>

      <div id="authActions" class="auth-actions-group">
        <button type="button" class="btn btn-secondary btn-sm" onclick="window.auth.openPortalLogin('usuario')" title="Ingreso para usuarios de la comunidad">
          <i class="fas fa-user icon-success"></i> Usuario
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="window.auth.openPortalLogin('funcionario')" title="Ingreso para personal de la biblioteca">
          <i class="fas fa-user-tie icon-warning"></i> Funcionario
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="window.auth.openPortalLogin('superadmin')" title="Ingreso exclusivo para administración general">
          <i class="fas fa-shield-alt icon-purple"></i> Super Admin
        </button>
        <button type="button" class="btn btn-primary btn-sm" onclick="window.showModal('registerModal')" title="Crear cuenta nueva de usuario">
          <i class="fas fa-user-plus"></i> Registro
        </button>
      </div>

      <div id="userProfileMenu" class="user-profile-menu">
        <div class="user-profile-info">
          <span id="navUserName" class="nav-user-name">Usuario</span>
          <span id="navUserRole" class="status-badge disponible nav-user-role">ROL</span>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="logoutBtn" title="Cerrar sesión" aria-label="Cerrar sesión">
          <i class="fas fa-power-off icon-danger"></i>
        </button>
      </div>
    </div>

  </div>
</header>
