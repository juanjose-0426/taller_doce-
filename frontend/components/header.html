<!-- =========================================================================
     BARRA SUPERIOR DE NAVEGACIÓN (HEADER & PROFILE)
     ========================================================================= -->

<header class="main-header">
  <div class="header-container">
    
    <!-- Marca y Logotipo -->
    <a href="javascript:void(0)" class="brand" onclick="window.router.navigate('publicView')">
      <div class="brand-icon">
        <i class="fas fa-desktop"></i>
      </div>
      <div class="brand-info">
        <span class="brand-title">BiblioTiempoDoce</span>
        <span class="brand-subtitle">Biblioteca 12 de Octubre</span>
      </div>
    </a>

    <!-- Reloj del Sistema y Enlaces de Navegación -->
    <div class="header-center">
      <div class="system-clock">
        <i class="fas fa-clock"></i>
        <span id="systemClockTime">00:00:00</span>
      </div>
      <div id="navLinks" style="display: flex; gap: 0.5rem;">
        <!-- Enlaces dinámicos según rol -->
      </div>
    </div>

    <!-- Acciones de Cabecera: Notificaciones y Login/Perfil -->
    <div class="header-actions">
      <!-- Notificaciones -->
      <button class="btn-icon" id="notificationToggleBtn" title="Notificaciones">
        <i class="fas fa-bell"></i>
        <span id="navNotificationBadge" style="display: none; position: absolute; top: -4px; right: -4px; background: var(--status-ocupado); color: #fff; font-size: 0.65rem; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; align-items: center; justify-content: center;">0</span>
      </button>

      <!-- Botones de ingreso separados en barra superior -->
      <div id="authActions" style="display: flex; gap: 0.4rem; align-items: center;">
        <button class="btn btn-secondary btn-sm" onclick="window.auth.openPortalLogin('usuario')" title="Ingreso para usuarios de la comunidad">
          <i class="fas fa-user" style="color: var(--status-disponible);"></i> Usuario
        </button>
        <button class="btn btn-secondary btn-sm" onclick="window.auth.openPortalLogin('funcionario')" title="Ingreso para personal de la biblioteca">
          <i class="fas fa-user-tie" style="color: var(--status-warning);"></i> Funcionario
        </button>
        <button class="btn btn-secondary btn-sm" onclick="window.auth.openPortalLogin('superadmin')" title="Ingreso exclusivo para administración general">
          <i class="fas fa-shield-alt" style="color: #a78bfa;"></i> Super Admin
        </button>
        <button class="btn btn-primary btn-sm" onclick="window.showModal('registerModal')" title="Crear cuenta nueva de usuario">
          <i class="fas fa-user-plus"></i> Registro
        </button>
      </div>

      <!-- Menú de usuario logueado -->
      <div id="userProfileMenu" style="display: none; align-items: center; gap: 0.75rem;">
        <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2;">
          <span id="navUserName" style="font-size: 0.88rem; font-weight: 700;">Usuario</span>
          <span id="navUserRole" class="status-badge disponible" style="font-size: 0.65rem; padding: 0.1rem 0.4rem;">ROL</span>
        </div>
        <button class="btn btn-secondary btn-sm" id="logoutBtn" title="Cerrar sesión">
          <i class="fas fa-power-off" style="color: var(--status-ocupado);"></i>
        </button>
      </div>
    </div>

  </div>
</header>
