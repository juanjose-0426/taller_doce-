<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioTiempoDoce | Biblioteca 12 de Octubre</title>
  <meta name="description" content="Sistema de control de tiempo, lista de espera y gestión inteligente de computadores de la Biblioteca 12 de Octubre - Medellín.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <div id="header-slot"></div>

  <main class="main-content">
    <div id="public-view-slot"></div>
    <div id="user-view-slot"></div>
    <div id="staff-view-slot"></div>
    <div id="admin-view-slot"></div>
  </main>

  <div id="notifications-slot"></div>

  <div id="modals-auth-slot"></div>
  <div id="modals-staff-slot"></div>
  <div id="modals-admin-slot"></div>

  <div class="toast-container" id="toastContainer"></div>

  <div id="footer-slot"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/userPanel.js"></script>
  <script src="/js/staffPanel.js"></script>
  <script src="/js/adminPanel.js"></script>
  <script src="/js/componentLoader.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
